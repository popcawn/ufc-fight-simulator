name: Update stats

# Rebuilds the fighter roster from the latest UFCStats data and commits it.
# GitHub Pages then re-publishes automatically on the new commit.
on:
  schedule:
    - cron: "0 14 * * 1"   # every Monday 14:00 UTC (captures the weekend's fights)
  workflow_dispatch: {}     # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # allow the action to commit the refreshed roster

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Rebuild roster from latest UFCStats data (downloads the CSVs)
        run: node build-roster.mjs
      - name: Fetch pro histories for new fighters (ESPN, cached; never blocks the roster update)
        run: node espn-history.mjs || echo "::warning::ESPN history step failed — roster still updates, pro records catch up next week"
      - name: Re-inject the roster with any new pro histories (reuses the downloaded CSVs)
        run: node build-roster.mjs --cache
      - name: Commit if the roster changed
        run: |
          git config user.name  "ufc-stats-bot"
          git config user.email "actions@github.com"
          git add index.html ufc-roster.json espn-history.json
          if git diff --cached --quiet; then
            echo "No changes — roster already current."
          else
            git commit -m "Auto-update roster ($(date -u +%Y-%m-%d))"
            git pull --rebase -q   # the odds bot commits twice a day; don't let its push race ours
            git push
          fi
